apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateless-api
  namespace: cloud-dynamics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stateless-api
  template:
    metadata:
      labels:
        app: stateless-api
    spec:
      containers:
      - name: stateless-api
        image: cloud-dynamics/stateless-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stateless-api
  namespace: cloud-dynamics
spec:
  selector:
    app: stateless-api
  ports:
  - port: 8080
    targetPort: 8080
