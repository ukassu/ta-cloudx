apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: cloud-dynamics}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - {name: redis, image: redis:8-alpine, ports: [{containerPort: 6379}], resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: cloud-dynamics}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cache-api, namespace: cloud-dynamics}
spec:
  replicas: 2
  selector: {matchLabels: {app: cache-api}}
  template:
    metadata: {labels: {app: cache-api}}
    spec:
      containers:
      - name: cache-api
        image: cloud-dynamics/cache-api:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: cache-api, namespace: cloud-dynamics}
spec:
  selector: {app: cache-api}
  ports: [{port: 8080, targetPort: 8080}]
