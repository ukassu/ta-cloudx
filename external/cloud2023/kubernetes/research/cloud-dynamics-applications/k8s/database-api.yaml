apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: cloud-dynamics}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - {name: POSTGRES_DB, value: app}
        - {name: POSTGRES_USER, value: app}
        - {name: POSTGRES_PASSWORD, value: app}
        ports: [{containerPort: 5432}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: cloud-dynamics}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: database-api, namespace: cloud-dynamics}
spec:
  replicas: 2
  selector: {matchLabels: {app: database-api}}
  template:
    metadata: {labels: {app: database-api}}
    spec:
      containers:
      - name: database-api
        image: cloud-dynamics/database-api:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: database-api, namespace: cloud-dynamics}
spec:
  selector: {app: database-api}
  ports: [{port: 8080, targetPort: 8080}]
