# detector/k8s_integration/k8s/controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detector-controller
  template:
    metadata:
      labels:
        app: detector-controller
    spec:
      serviceAccountName: detector-controller
      containers:
        - name: controller
          image: REPLACE_ME/detector-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_NAMESPACE
              value: "testbed-jobs"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: detector-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: detector-controller
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: detector-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: detector-controller
subjects:
  - kind: ServiceAccount
    name: detector-controller
    namespace: default  # TODO: sesuaikan namespace deployment controller
